# Notare server settings shared by every profile.

spring.application.name=notare

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.api-version=v1
app.title=api/${app.api-version}

spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

notare.voice.max-size=20MB
notare.voice.max-duration-seconds=600

notare.rate-limit.sync-per-minute=${RATE_LIMIT_SYNC_PER_MINUTE:30}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.reset-token-expiration-ms=${JWT_RESET_TOKEN_EXPIRATION_MS:600000}

app.admin.wipe-secret=${ADMIN_WIPE_SECRET:}
app.admin.migration-secret=${ADMIN_MIGRATION_SECRET:}

app.session.refresh-token-expiry-days=${SESSION_REFRESH_TOKEN_EXPIRY_DAYS:30}
app.session.max-concurrent-sessions=${SESSION_MAX_CONCURRENT_SESSIONS:5}

spring.jackson.mapper.accept-case-insensitive-enums=true
internal-auth.user-events.secret=${INTERNAL_AUTH_USER_EVENTS_SECRET:}

notare.transcription.engine=${TRANSCRIPTION_ENGINE:deepgram}
notare.transcription.deepgram.api-key=${DEEPGRAM_API_KEY:}
notare.transcription.deepgram.model=${DEEPGRAM_MODEL:nova-3}
notare.transcription.deepgram.mip-opt-out=${DEEPGRAM_MIP_OPT_OUT:true}

notare.tidy.enabled=${TIDY_ENABLED:false}
notare.tidy.idle-minutes=${TIDY_IDLE_MINUTES:10}
notare.tidy.batch-size=${TIDY_BATCH_SIZE:20}
notare.tidy.max-attempts=${TIDY_MAX_ATTEMPTS:3}
notare.tidy.min-words-for-title=15
notare.tidy.daily-title-cap-per-user=${TIDY_DAILY_TITLE_CAP:50}
notare.tidy.max-chars=${TIDY_MAX_CHARS:20000}
notare.tidy.engine=${TIDY_ENGINE:stub}
notare.tidy.corrector=${TIDY_CORRECTOR:stub}
notare.tidy.languagetool.url=${LANGUAGETOOL_URL:http://languagetool:8010}

notare.client.min-version=${CLIENT_MIN_VERSION:0.0.0}

app.maintenance.enabled=${MAINTENANCE_MODE:false}
