spring.application.name=notare

###############################################################
# Active Profile ? override with env var SPRING_PROFILES_ACTIVE
# Possible values: dev, prod, test
###############################################################
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#####################################################
# API
#####################################################
app.api-version=v1
app.title=api/${app.api-version}

#####################################################
# JPA (common ? behavior differs per profile below)
#####################################################
spring.jpa.open-in-view=false

#####################################################
# File uploads (multipart) ? hard ceilings for ALL environments.
# Spring's own defaults are only 1MB/10MB, which would reject audio.
# These are the outer limits; the app-level validator (4C) enforces a
# stricter, friendlier limit and returns a clean error below these.
#####################################################
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

#####################################################
# Voice notes ? app-level validation (friendly errors).
# Keep max-size <= spring.servlet.multipart.max-file-size above.
#####################################################
notare.voice.max-size=20MB
notare.voice.max-duration-seconds=600
notare.voice.allowed-content-types=audio/mpeg,audio/mp4,audio/aac,audio/wav,audio/x-wav,audio/webm,audio/ogg

#####################################################
# OTP (identical across environments)
#####################################################
app.otp.length=6
app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60


#####################################################
# JWT
# app.jwt.secret must be a Base64-encoded string that decodes to
# at least 32 bytes (256 bits). Generate one with, e.g.:
#   openssl rand -base64 32
# No default here on purpose: startup fails fast if JWT_SECRET
# isn't set. The dev/test profiles supply their own local-only
# default so you don't need to export it for local work.
#####################################################
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.reset-token-expiration-ms=${JWT_RESET_TOKEN_EXPIRATION_MS:600000}

#####################################################
# Sessions / refresh tokens (stored in Redis)
#####################################################
app.session.refresh-token-expiry-days=${SESSION_REFRESH_TOKEN_EXPIRY_DAYS:30}
app.session.max-concurrent-sessions=${SESSION_MAX_CONCURRENT_SESSIONS:5}