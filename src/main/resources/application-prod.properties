#####################################################
# Datasource (PostgreSQL ? production)
#####################################################
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#####################################################
# JPA / Hibernate
#####################################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#####################################################
# Connection pool (HikariCP ? sane production defaults)
#####################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

#####################################################
# Mailjet
#####################################################
app.mailjet.api-key=${MAILJET_API_KEY}
app.mailjet.secret-key=${MAILJET_SECRET_KEY}
app.mailjet.from-email=${MAILJET_FROM_EMAIL}
app.mailjet.from-name=${MAILJET_FROM_NAME}

#####################################################
# Logging
#####################################################
logging.level.com.notare=INFO
logging.level.org.hibernate.SQL=WARN


####################
# Server
####################
server.port=${PORT:2001}
base-url=${BASE_URL:http://localhost:2001}

#####################################################
# Redis (sessions/refresh tokens)
#####################################################
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}