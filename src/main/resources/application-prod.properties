#####################################################
# Datasource (PostgreSQL ? production / Neon)
#
# DB_HOST: use Neon's DIRECT host (no "-pooler" in it), not the pgbouncer
# one. HikariCP below already pools connections app-side; stacking Neon's
# transaction-mode pooler underneath it fights Hibernate's server-side
# prepared statement cache (classic symptom: "prepared statement S_1
# already exists"). Revisit only if a real need for pgbouncer shows up.
#####################################################
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#####################################################
# Flyway
#
# Neon's free-tier compute auto-suspends after a few minutes idle. On the
# very first boot after a deploy (or after the compute has been asleep),
# Flyway's first connection attempt can land while it's still waking up.
# Without a retry, that shows up as a boot-time failure that looks like a
# bad connection string when it's really just a ~1-5s cold start. These
# retries only apply to Flyway's own migration connection, not the app's
# ongoing Hikari pool.
#####################################################
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5

#####################################################
# JPA / Hibernate
#####################################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#####################################################
# Connection pool (HikariCP ? sane production defaults)
#####################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

#####################################################
# Mailjet
#####################################################
app.mailjet.api-key=${MAILJET_API_KEY}
app.mailjet.secret-key=${MAILJET_SECRET_KEY}
app.mailjet.from-email=${MAILJET_FROM_EMAIL}
app.mailjet.from-name=${MAILJET_FROM_NAME}

#####################################################
# Logging
#####################################################
logging.level.com.notare=INFO
logging.level.org.hibernate.SQL=WARN


####################
# Server
####################
server.port=${PORT:2001}
base-url=${BASE_URL:http://localhost:2001}

#####################################################
# Redis (sessions/refresh tokens)
#####################################################
spring.data.redis.url=${REDIS_URL}

#####################################################
# File storage (voice notes)
#
# notare.storage.backend picks which FileStorageService bean is active:
#   postgres -> PostgresFileStorageService, bytes stored in the file_blobs
#               table of this same Postgres database. Temporary, until R2
#               is set up ? no external service required.
#   r2       -> R2FileStorageService (Cloudflare R2, S3-compatible). Default
#               if STORAGE_BACKEND is unset, matching prior behavior.
#
# Right now: set STORAGE_BACKEND=postgres in Render's env vars and leave the
# R2_* vars unset entirely. Flip STORAGE_BACKEND to "r2" and set the four
# R2_* vars once an R2 account exists ? no code change needed either way.
#####################################################
notare.storage.backend=${STORAGE_BACKEND:r2}

# Empty-string defaults (not required-with-no-default like before) so the
# app can still boot when backend=postgres and these are never set. When
# backend=r2 IS selected, R2FileStorageService's own constructor fails fast
# on a blank value ? same "fail at boot, not at first upload" reasoning
# app.jwt.secret uses.
notare.storage.r2.endpoint=${R2_ENDPOINT:}
notare.storage.r2.bucket=${R2_BUCKET:}
notare.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
notare.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}