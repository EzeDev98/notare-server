# Notare server settings for production.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

logging.level.com.notare=INFO
logging.level.org.hibernate.SQL=WARN

server.port=${PORT:2001}
base-url=${BASE_URL:http://localhost:2001}

spring.data.redis.url=${REDIS_URL}

notare.storage.backend=${STORAGE_BACKEND:r2}

notare.storage.r2.endpoint=${R2_ENDPOINT:${AWS_ENDPOINT_URL_S3:}}
notare.storage.r2.bucket=${R2_BUCKET:}
notare.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:}}
notare.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:}}
notare.storage.r2.region=${R2_REGION:${AWS_REGION:auto}}
internal-auth.base-url=${INTERNAL_AUTH_BASE_URL}
internal-auth.client-id=${INTERNAL_AUTH_CLIENT_ID:notare}
internal-auth.client-secret=${INTERNAL_AUTH_CLIENT_SECRET}
internal-auth.reset.secret=${INTERNAL_AUTH_RESET_SECRET:}
internal-auth.issuer-uri=${INTERNAL_AUTH_ISSUER_URI}
internal-auth.client-application-id=${INTERNAL_AUTH_CLIENT_APPLICATION_ID:}
